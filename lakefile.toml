name = "tau-tpu"
version = "0.1.0"
# `lake build` builds the library and its proofs, both test suites and both
# tools.
defaultTargets = ["Tau", "TauTest", "CourseTest", "tau-sim", "tau-check"]

[[lean_lib]]
name = "Tau"
srcDir = "spec"

# Tests of the specification alone.
[[lean_lib]]
name = "TauTest"
srcDir = "spec/tests"

[[lean_exe]]
name = "tau-sim"
root = "TauSim"
srcDir = "spec/tools"

[[lean_exe]]
name = "tau-check"
root = "TauCheck"
srcDir = "spec/tools"

# The course proof exercises: finished proof files with the proofs removed.
# Generated by scripts/make-exercises.py.
[[lean_lib]]
name = "Prove"
srcDir = "course"
globs = ["Prove.+"]

# The specification exercises: definitions for you to write from a source,
# with tests. `course/Specify/Blocks/Memory.lean` is the module
# `Specify.Blocks.Memory`.
[[lean_lib]]
name = "Specify"
srcDir = "course"
globs = ["Specify.+"]

# Tests of the course: the tables of the docs hold of the specification, and
# every specification exercise can be solved.
[[lean_lib]]
name = "CourseTest"
srcDir = "course/tests"

# A place for a student's own files. `course/Work/Foo.lean` is the module
# `Work.Foo`, and files there can import each other.
[[lean_lib]]
name = "Work"
srcDir = "course"
globs = ["Work.+"]
