name = "tau-tpu"
version = "0.1.0"
defaultTargets = ["Tau"]

[[lean_lib]]
name = "Tau"
srcDir = "spec"

[[lean_lib]]
name = "TauTest"
srcDir = "spec/tests"

[[lean_exe]]
name = "tau-sim"
root = "TauSim"
srcDir = "spec/tools"

[[lean_exe]]
name = "tau-check"
root = "TauCheck"
srcDir = "spec/tools"

# The course proof exercises: finished proof files with the proofs removed.
# Generated by scripts/make-exercises.py.
[[lean_lib]]
name = "Prove"
srcDir = "course"
globs = ["Prove.+"]

# The specification exercises: definitions for you to write from a source,
# with tests. `course/Specify/Foo.lean` is the module `Specify.Foo`.
[[lean_lib]]
name = "Specify"
srcDir = "course"
globs = ["Specify.+"]

# A place for a student's own files. `course/Work/Foo.lean` is the module
# `Work.Foo`, and files there can import each other.
[[lean_lib]]
name = "Work"
srcDir = "course"
globs = ["Work.+"]
