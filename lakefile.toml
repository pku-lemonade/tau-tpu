name = "tau-tpu"
version = "0.1.0"
defaultTargets = ["Tau"]

[[lean_lib]]
name = "Tau"

[[lean_lib]]
name = "TauTest"
srcDir = "tests"

[[lean_exe]]
name = "tau-sim"
root = "TauSim"
srcDir = "tools"

[[lean_exe]]
name = "tau-check"
root = "TauCheck"
srcDir = "tools"

# The course exercises: finished proof files with the proofs removed.
# Generated by scripts/make-exercises.py.
[[lean_lib]]
name = "Exercises"
srcDir = "course"
globs = ["Exercises.+"]
