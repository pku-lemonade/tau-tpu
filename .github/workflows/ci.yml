name: CI

# The install steps are the ones in README.md ("Setup"), without `sudo`
# because the jobs run as root. Keep the two in step.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm-slim", "ubuntu:24.04"]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install tools (README steps 1, 2 and 5)
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates python3
          apt-get install -y cmake ninja-build g++ wget lsb-release gnupg software-properties-common
          wget https://apt.llvm.org/llvm.sh && bash llvm.sh 21 && rm llvm.sh
          apt-get install -y llvm-21-dev libmlir-21-dev mlir-21-tools
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Lean library, proofs and tests (README step 3)
        run: lake build Tau TauTest tau-sim tau-check
      - name: Exercises are up to date and compile
        run: |
          python3 scripts/make-exercises.py --check
          lake build Exercises Work
      - name: Compiler (README step 5)
        run: |
          cmake -S compiler -B compiler/build -G Ninja -DMLIR_DIR=/usr/lib/llvm-21/lib/cmake/mlir
          cmake --build compiler/build
      - name: Examples (README step 6)
        run: scripts/check-examples.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container in docker/
        run: docker build -f docker/Dockerfile -t tau-tpu .
      - name: Build and check everything inside it
        run: |
          docker run --rm -v "$PWD:/work" -w /work tau-tpu bash -c '
            set -e
            lake build Tau TauTest tau-sim tau-check
            cmake -S compiler -B compiler/build -G Ninja -DMLIR_DIR=/usr/lib/llvm-21/lib/cmake/mlir
            cmake --build compiler/build
            scripts/check-examples.sh'
